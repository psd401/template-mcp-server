version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript >=7 (the native port) is not yet supported by the lint/test
      # toolchain (typescript-eslint <6.1, ts-jest <7). Majors need a human
      # toolchain review; remove this once the ecosystem catches up.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
